services:
  web:
    container_name: web
    build: .
    command: sh -c "python manage.py migrate && python manage.py createadmin && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 300 --workers $$(($$(nproc) * 2 + 1)) --log-level=debug"
    ports:
      - 8000:8000
    restart: on-failure
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
      - ./static_volume:/var/www/static

  db:
    container_name: db
    image: postgres:15-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  celery:
    container_name: celery
    build: .
    command: sh -c "celery -A celery worker --loglevel=INFO -B"
    restart: on-failure
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/payouts_test
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

  redis:
    container_name: redis
    image: redis:7.4
    restart: always
    ports:
      - "6379:6379"
    env_file: ".env"
    volumes:
      - ./redis/data:/root/redis
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf

  nginx:
    container_name: nginx
    image: nginx:1.23.0-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./static_volume:/var/www/static
    ports:
      - "80:80"
    restart: on-failure
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume: