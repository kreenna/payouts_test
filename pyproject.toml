[tool.poetry]
name = "payouts-test"
version = "0.1.0"
description = ""
authors = ["Arina rudenskaaarina@gmail.com"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.2.9"
dotenv = "^0.9.9"
psycopg2-binary = "^2.9.11"
djangorestframework = "^3.16.1"
celery = "^5.6.0"
redis = "^7.1.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.11.0"
isort = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# максимальная длина строки
line-length = 119
# файлы, которые не нужно форматировать
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | __pycache__
  | \.venv
  | env
  | migrations
)/
'''

[tool.isort]
# максимальная длина строки
line_length = 119
